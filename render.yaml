services:
  - type: web
    name: derp-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOW_DEMO_LOGIN
        value: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: derp
